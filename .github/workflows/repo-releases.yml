name: Update Module Release Tags

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Fetch Latest Releases and Update README
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          # Generate Markdown Table Header
          TABLE="| Repository | Latest Release |\n| :--- | :--- |\n"

          # Fetch repos starting with aws-tofu
          REPOS=$(gh repo list "$ORG" --limit 100 --json name --jq '.[] | select(.name | startswith("aws-tofu")) | .name')

          for repo in $REPOS; do
            TAG=$(gh release view --repo "$ORG/$repo" --json tagName --jq '.tagName' 2>/dev/null || echo "No Release")
            TABLE="${TABLE}| [$repo](https://github.com/$ORG/$repo) | \`$TAG\` |\n"
          done

          # Export TABLE as an environment variable for Python
          export TABLE

          python3 -c '
          import os, re

          table_content = os.environ.get("TABLE", "")

          with open("README.md", "r") as f:
              content = f.read()

          new_content = re.sub(
              r"<!-- START_RELEASE_TABLE -->.*?<!-- END_RELEASE_TABLE -->",
              f"<!-- START_RELEASE_TABLE -->\n{table_content}<!-- END_RELEASE_TABLE -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(new_content)
          '

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update aws-tofu module release versions" && git push)