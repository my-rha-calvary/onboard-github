name: Update Module Release Tags

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Fetch Latest Releases and Update README
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          python3 -c '
          import os, re, json, subprocess

          org = os.environ["ORG"]

          # 1. Fetch matching repos (starts with my-rha- or aws-tofu)
          jq_filter = ".[] | select((.name | startswith(\"my-rha-\")) or (.name | startswith(\"aws-tofu\"))) | .name"
          cmd_repos = ["gh", "repo", "list", org, "--limit", "200", "--json", "name", "--jq", jq_filter]
          
          try:
              repos_out = subprocess.check_output(cmd_repos, text=True).strip()
              repos = [r for r in repos_out.splitlines() if r]
          except Exception as e:
              print(f"Error listing repos: {e}")
              repos = []

          table = "| Repository | Latest Release | Release Notes |\n| :--- | :--- | :--- |\n"

          for repo in repos:
              # 2. Get latest release tag and body
              try:
                  cmd_rel = ["gh", "release", "view", "--repo", f"{org}/{repo}", "--json", "tagName,body"]
                  rel_out = subprocess.check_output(cmd_rel, text=True)
                  rel_data = json.loads(rel_out)
                  tag = rel_data.get("tagName", "No Release")
                  raw_body = rel_data.get("body", "") or "N/A"
                  body = raw_body.replace("\r\n", " ").replace("\n", " ").replace("|", "\\|")
                  if len(body) > 100:
                      body = body[:100] + "..."
              except Exception:
                  tag = "No Release"
                  body = "N/A"

              table += f"| [{repo}](https://github.com/{org}/{repo}) | `{tag}` | {body} |\n"

          # 3. Update README.md
          with open("README.md", "r") as f:
              content = f.read()

          new_content = re.sub(
              r"<!-- START_RELEASE_TABLE -->.*?<!-- END_RELEASE_TABLE -->",
              f"<!-- START_RELEASE_TABLE -->\n{table}<!-- END_RELEASE_TABLE -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(new_content)
          '

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update aws-tofu module release versions" && git push)