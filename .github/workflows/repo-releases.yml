name: Update Module Release Tags

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Fetch Latest Releases and Update README
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          python3 -c '
          import os, json, subprocess, re

          org = os.environ["ORG"]

          # Run gh CLI to list matching repos
          cmd_repos = f"gh repo list {org} --limit 100 --json name --jq \".[[] | select(.name | startswith(\\\"aws-tofu\\\")) | .name\""
          repos = subprocess.check_output(cmd_repos, shell=True, text=True).strip().splitlines()

          table = "| Repository | Latest Release |\n| :--- | :--- |\n"

          for repo in repos:
              if not repo:
                  continue
              try:
                  cmd_tag = f"gh release view --repo {org}/{repo} --json tagName --jq .tagName"
                  tag = subprocess.check_output(cmd_tag, shell=True, text=True).strip()
              except Exception:
                  tag = "No Release"
              table += f"| [{repo}](https://github.com/{org}/{repo}) | `{tag}` |\n"

          with open("README.md", "r") as f:
              content = f.read()

          new_content = re.sub(
              r"<!-- START_RELEASE_TABLE -->.*?<!-- END_RELEASE_TABLE -->",
              f"<!-- START_RELEASE_TABLE -->\n{table}<!-- END_RELEASE_TABLE -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(new_content)
          '

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update aws-tofu module release versions" && git push)